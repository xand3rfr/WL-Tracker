<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Blacktop Legends: MyPLAYER Builder</title>
  <meta name="description" content="Build your own basketball MyPLAYER: body, position, attributes, badges and animations, with a live 3D preview.">
  <meta name="theme-color" content="#050706">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800;900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg class="brand-ball" viewBox="0 0 48 48" aria-hidden="true">
        <circle cx="24" cy="24" r="21" fill="none" stroke="currentColor" stroke-width="3"/>
        <path d="M3 24h42M24 3v42M9 9c8 6 8 24 0 30M39 9c-8 6-8 24 0 30" fill="none" stroke="currentColor" stroke-width="2.5"/>
      </svg>
      <div class="brand-text">
        <span class="brand-title">Blacktop Legends</span>
        <span class="brand-sub">MyPLAYER Builder</span>
      </div>
    </div>
    <div class="top-ovr" aria-live="polite">
      <span class="top-ovr-num" id="topOvr">--</span>
      <span class="top-ovr-meta"><b>OVR</b><span id="topArch">--</span></span>
    </div>
    <div class="top-actions">
      <button class="btn ghost" data-action="random" title="Generate a random player">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8" cy="8" r="1.4"/><circle cx="16" cy="16" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="16" cy="8" r="1.4"/><circle cx="8" cy="16" r="1.4"/></svg>
        <span>Random</span>
      </button>
      <button class="btn ghost" data-action="reset" title="Reset to a fresh build">
        <svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v5h5"/></svg>
        <span>Reset</span>
      </button>
      <button class="btn ghost" data-action="share" title="Copy a share link">
        <svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="M8.2 10.8l7.6-4.4M8.2 13.2l7.6 4.4"/></svg>
        <span>Share</span>
      </button>
      <button class="btn primary" data-action="save" title="Save this build">
        <svg viewBox="0 0 24 24"><path d="M5 3h11l3 3v15H5z"/><path d="M8 3v6h8V3M8 21v-7h8v7"/></svg>
        <span>Save</span>
      </button>
    </div>
  </header>

  <main class="layout">
    <nav class="tabs" role="tablist" aria-label="Builder sections" id="tabs"></nav>

    <section class="stage" aria-label="Player preview">
      <div class="stage-canvas" id="stageCanvas"></div>
      <div class="stage-card">
        <div class="stage-num" id="cardNum">#0</div>
        <div>
          <div class="stage-name" id="cardName">--</div>
          <div class="stage-nick" id="cardNick"></div>
          <div class="stage-phys" id="cardPhys"></div>
        </div>
      </div>
      <div class="stage-ovr">
        <svg viewBox="0 0 120 120" class="ovr-ring" aria-hidden="true">
          <circle cx="60" cy="60" r="52" class="ovr-track"/>
          <circle cx="60" cy="60" r="52" class="ovr-fill" id="ovrRing"/>
        </svg>
        <div class="ovr-inner">
          <span class="ovr-num" id="stageOvr">--</span>
          <span class="ovr-lbl">Overall</span>
        </div>
      </div>
      <div class="stage-arch">
        <span class="arch-kicker">Build</span>
        <span class="arch-name" id="stageArch">--</span>
        <span class="arch-tags" id="stageArchTags"></span>
      </div>
      <div class="stage-controls">
        <div class="seg" id="viewSeg" role="group" aria-label="Camera">
          <button data-view="full" class="on">Full</button>
          <button data-view="upper">Upper</button>
          <button data-view="face">Face</button>
        </div>
        <button class="icon-btn" id="rotateBtn" title="Auto-rotate" aria-pressed="false">
          <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7M21 4v5h-5"/></svg>
        </button>
      </div>
      <div class="stage-anims" id="animBar" role="group" aria-label="Preview animations"></div>
      <div class="stage-hint">Drag to rotate · Scroll / pinch to zoom</div>
    </section>

    <section class="panel" id="panel" role="tabpanel"></section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <dialog class="modal" id="modal"></dialog>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
